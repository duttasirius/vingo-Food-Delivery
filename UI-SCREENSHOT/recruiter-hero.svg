<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Vingo AI Food Delivery Platform</title><desc id="desc">Recruiter overview showing customer UI, AI assistant, real-time delivery and technology stack.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#fee2e2"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect width="1400" height="720" rx="36" fill="url(#bg)"/><text x="70" y="92" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#111827">🍔 Vingo</text><text x="70" y="132" font-family="Arial,sans-serif" font-size="24" fill="#4b5563">AI-powered food delivery • MERN • Realtime • Payments</text><rect x="70" y="180" width="760" height="450" rx="24" fill="#ffffff" stroke="#e5e7eb"/><rect x="95" y="205" width="710" height="55" rx="12" fill="#f9fafb"/><circle cx="125" cy="232" r="9" fill="#ef4444"/><circle cx="153" cy="232" r="9" fill="#f59e0b"/><circle cx="181" cy="232" r="9" fill="#22c55e"/><rect x="110" y="285" width="310" height="250" rx="18" fill="#fff1f2"/><text x="135" y="325" font-family="Arial" font-size="25" font-weight="700" fill="#111827">Find your food</text><rect x="135" y="350" width="260" height="48" rx="24" fill="#fff" stroke="#e5e7eb"/><text x="155" y="381" font-family="Arial" font-size="16" fill="#6b7280">veg pizza near me...</text><rect x="135" y="420" width="120" height="88" rx="12" fill="#fed7aa"/><rect x="270" y="420" width="125" height="88" rx="12" fill="#fecaca"/><text x="155" y="470" font-family="Arial" font-size="18" font-weight="700" fill="#7c2d12">Pizza</text><text x="292" y="470" font-family="Arial" font-size="18" font-weight="700" fill="#7f1d1d">Burger</text><rect x="445" y="285" width="335" height="250" rx="18" fill="#111827"/><text x="475" y="325" font-family="Arial" font-size="21" font-weight="700" fill="#fff">🤖 Vingo AI</text><text x="475" y="365" font-family="Arial" font-size="16" fill="#d1d5db">Try: “something spicy”</text><rect x="475" y="390" width="260" height="48" rx="12" fill="#1f2937"/><text x="495" y="421" font-family="Arial" font-size="15" fill="#fff">🍕 Real catalog result</text><rect x="475" y="450" width="120" height="48" rx="12" fill="url(#accent)"/><text x="492" y="480" font-family="Arial" font-size="15" font-weight="700" fill="#fff">Add to cart</text><rect x="875" y="180" width="455" height="450" rx="24" fill="#111827"/><text x="915" y="230" font-family="Arial" font-size="25" font-weight="700" fill="#fff">Built with</text><g font-family="Arial" font-size="18" font-weight="700"><rect x="915" y="260" width="185" height="44" rx="12" fill="#61dafb"/><text x="940" y="289" fill="#111827">React 19</text><rect x="1115" y="260" width="175" height="44" rx="12" fill="#339933"/><text x="1140" y="289" fill="#fff">Node.js</text><rect x="915" y="320" width="185" height="44" rx="12" fill="#47a248"/><text x="940" y="349" fill="#fff">MongoDB</text><rect x="1115" y="320" width="175" height="44" rx="12" fill="#764abc"/><text x="1140" y="349" fill="#fff">Redux</text><rect x="915" y="380" width="185" height="44" rx="12" fill="#4285f4"/><text x="940" y="409" fill="#fff">Gemini AI</text><rect x="1115" y="380" width="175" height="44" rx="12" fill="#010101"/><text x="1140" y="409" fill="#fff">Socket.IO</text><rect x="915" y="440" width="185" height="44" rx="12" fill="#3395ff"/><text x="940" y="469" fill="#fff">Razorpay</text><rect x="1115" y="440" width="175" height="44" rx="12" fill="#3448c5"/><text x="1140" y="469" fill="#fff">Cloudinary</text></g><text x="915" y="535" font-family="Arial" font-size="17" fill="#d1d5db">Customer • Owner • Delivery</text><text x="915" y="565" font-family="Arial" font-size="17" fill="#d1d5db">JWT • Google Auth • GeoJSON</text><text x="915" y="595" font-family="Arial" font-size="17" fill="#d1d5db">Orders •